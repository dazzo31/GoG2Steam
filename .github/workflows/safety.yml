name: Shortcut safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 safety regression suite
        shell: powershell
        run: ./tests/Safety.Tests.ps1
      - name: PowerShell 7 safety regression suite
        shell: pwsh
        run: ./tests/Safety.Tests.ps1
