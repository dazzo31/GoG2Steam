name: 🐛 Bug Report
description: Report a bug or issue when importing GOG Galaxy games into Steam
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before opening, please make sure Steam was completely closed before running GoG2Steam.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating System & PowerShell Version
      description: e.g., Windows 11 23H2, PowerShell 5.1 / PowerShell 7.4
      placeholder: Windows 11, PowerShell 5.1
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any error messages or transcript output here.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I verified that Steam was completely shut down before running the script.
          required: true
        - label: I checked existing issues to avoid creating duplicates.
          required: true
